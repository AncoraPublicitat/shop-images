name: Remove backgrounds

on:
  workflow_dispatch:
    inputs:
      supplier:
        description: "Supplier (musai)"
        default: "musai"
  push:
    paths:
      - "*_urls.txt"

permissions:
  contents: write

concurrency:
  group: remove-backgrounds
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - run: pip install "rembg[cpu]" pillow
      - name: Process photos
        run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          python3 process.py "${{ github.event.inputs.supplier || 'musai' }}" ${{ matrix.shard }} 8

  index:
    needs: photos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the index
        run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          python3 make_index.py "${{ github.event.inputs.supplier || 'musai' }}"
          git add .
          git diff --cached --quiet || git commit -m "Update photo index"
          git pull --rebase
          git push
