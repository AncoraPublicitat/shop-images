name: tiles-hd
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install opencv-python-headless numpy
      - run: python3 match_tiles.py
      - if: always()
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          git add tiles_log.txt tiles_hd 2>/dev/null; git add tiles_log.txt || true
          git commit -m "HD tiles" || true; git pull --rebase; git push
